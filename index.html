:root{--navy:#0F2A4A;--night:#0A1C33;--gold:#E3A91B;--gold-soft:#FBF1D6;--bg:#F2F4F7;--line:#DCE2EA;--line2:#EBEFF4;--text:#1A2433;--muted:#5E6B7C;--faint:#8A96A6;
--ok:#1E8A63;--ok-s:#E3F3EC;--warn:#B7791F;--warn-s:#FCF0DA;--crit:#C0423A;--crit-s:#FAE7E5;--mid:#5C86B5;--lt:#A9C0DA}
*{box-sizing:border-box}
html{font-size:15px;scroll-behavior:smooth}
body{margin:0;font-family:"PJS","Plus Jakarta Sans","Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
p{margin:0}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

.bar{background:var(--night);color:#fff;padding:12px 32px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.logo{width:36px;height:36px;border-radius:9px;background:var(--gold);color:var(--night);display:grid;place-items:center;font-weight:800;font-size:13.5px;flex:none}
.bar .t b{display:block;font-size:14.5px}
.bar .t span{font-size:12px;color:#A9B8CC}
.ctl{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.ctl label{display:block;font-size:11.5px;color:#8FA3BD;margin-bottom:3px}
.ctl select{background:#16325A;border:1px solid #27466F;color:#fff;border-radius:8px;padding:7px 10px;font-size:13.5px}
.pbtn{background:none;border:1px solid #27466F;color:#D6E0EC;border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
.pbtn:hover{border-color:#8FA3BD;color:#fff}

main{max-width:1380px;margin:0 auto;padding:22px 32px 56px}

/* hero + rapor */
.hero{background:var(--navy);color:#fff;border-radius:14px;padding:26px 30px 22px}
.hero .who{font-size:13px;color:#A9B8CC}
.hero h1{font-size:30px;font-weight:750;margin:6px 0 4px;letter-spacing:-.025em}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{color:#C9D5E3;max-width:80ch}
.rapor{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:20px}
.rp{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:12px 12px 11px;text-align:left;cursor:pointer;color:#fff;position:relative;transition:background .15s}
.rp:hover{background:rgba(255,255,255,.11)}
.rp .lt{display:flex;align-items:center;gap:7px;font-size:12px;color:#C9D5E3}
.rp .lt i{width:20px;height:20px;border-radius:5px;background:#fff;color:var(--navy);font-style:normal;font-weight:800;font-size:11px;display:grid;place-items:center;flex:none}
.rp b{display:block;font-size:22px;font-weight:750;margin-top:8px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rp small{display:block;font-size:11.5px;color:#A9B8CC;line-height:1.35;min-height:2.7em}
.rp .st{position:absolute;top:10px;right:10px;width:10px;height:10px;border-radius:50%}
.st.ok{background:#4CC290}.st.warn{background:var(--gold)}.st.crit{background:#FF7A6E;box-shadow:0 0 0 3px rgba(255,122,110,.25)}

.sect{display:flex;align-items:baseline;gap:12px;margin:30px 0 12px}
.sect h2{font-size:19px}
.sect p{font-size:13px;color:var(--muted)}

/* early warning */
.ewgrid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px}
.ew{display:grid;grid-template-columns:86px 28px minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px 18px;border-top:1px solid var(--line2)}
.ew:first-child{border-top:0}
.sev{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:20px;text-align:center;white-space:nowrap}
.sev.crit{background:var(--crit-s);color:var(--crit)}.sev.warn{background:var(--warn-s);color:var(--warn)}.sev.ok{background:var(--ok-s);color:var(--ok)}
.dl{width:26px;height:26px;border-radius:6px;background:var(--navy);color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center;cursor:pointer;border:0}
.ew b{font-size:14.5px;display:block;line-height:1.4}
.ew .rule{font-size:12.5px;color:var(--muted);margin-top:3px}
.ew .pic{font-size:12px;color:var(--faint);text-align:right;white-space:nowrap}
.ew .pic strong{display:block;font-size:18px;color:var(--text);font-variant-numeric:tabular-nums}
.ewh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.ewh h3{font-size:15px}
.seg{display:flex;gap:4px;background:var(--line2);border-radius:8px;padding:3px}
.seg button{border:0;background:none;border-radius:6px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* heatmap */
.hm{width:100%;border-collapse:separate;border-spacing:3px;font-size:13px}
.hm th{font-size:12px;color:var(--muted);font-weight:600;padding:2px 4px;text-align:center}
.hm th.rh{text-align:left;color:var(--text);font-weight:600;font-size:12.5px;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm td{height:30px;border-radius:5px;text-align:center;font-size:11.5px;font-weight:700}
.hm td.ok{background:#D6EEE3;color:#1E6B4E}.hm td.warn{background:#F7DFA9;color:#7A5508}.hm td.crit{background:#E8786D;color:#fff}
.hmwrap{padding:14px 16px 16px}

/* dimension cards */
.dims{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.dim{padding:20px 22px;scroll-margin-top:80px}
.dim.wide{grid-column:1/-1}
.dimh{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.dimh .L{width:32px;height:32px;border-radius:8px;background:var(--navy);color:#fff;font-weight:800;display:grid;place-items:center;flex:none}
.dimh h3{font-size:16.5px}
.dimh p{font-size:12.5px;color:var(--muted);margin-top:2px}
.dimh .sev{margin-left:auto}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line2);border-radius:10px;margin-bottom:16px}
.kv div{padding:10px 14px;border-left:1px solid var(--line2)}
.kv div:first-child{border-left:0}
.kv span{font-size:12px;color:var(--muted);display:block}
.kv b{font-size:22px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--navy)}
.kv b small{font-size:13px;color:var(--muted);font-weight:600}
.kv .bad b{color:var(--crit)}.kv .good b{color:var(--ok)}
.flag{margin-top:14px;font-size:13px;padding:10px 12px;border-radius:8px;display:flex;gap:10px;align-items:flex-start}
.flag.crit{background:var(--crit-s);color:#8A2C24}.flag.warn{background:var(--warn-s);color:#6B4A06}.flag.ok{background:var(--ok-s);color:#17694B}
.flag i{font-style:normal;font-weight:800}
.lbl{font-size:12.5px;color:var(--muted);font-weight:600;margin:4px 0 8px}

/* charts */
.hb{display:grid;grid-template-columns:120px 1fr 70px;gap:10px;align-items:center;font-size:13px;margin-bottom:7px}
.hb .tr{height:14px;background:var(--line2);border-radius:3px;position:relative;overflow:hidden;display:flex}
.hb .tr i{display:block;height:100%}
.hb .tr em{position:absolute;top:-2px;bottom:-2px;border-right:2.5px solid var(--gold)}
.hb .v{text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.stack{display:flex;height:26px;border-radius:6px;overflow:hidden}
.stack i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
svg text{font-family:inherit}
.tip{position:fixed;pointer-events:none;background:var(--night);color:#fff;font-size:12.5px;padding:8px 10px;border-radius:7px;z-index:50;max-width:260px;line-height:1.45;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.foot{margin-top:28px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;display:grid;grid-template-columns:2fr 1fr;gap:20px}
.foot b{color:var(--text)}

@media (max-width:1150px){.rapor{grid-template-columns:repeat(4,1fr)}.ewgrid,.dims{grid-template-columns:1fr}.dim.wide{grid-column:auto}.foot{grid-template-columns:1fr}}
@media (max-width:720px){html{font-size:14px}main{padding:14px}.bar{padding:10px 14px}.ctl{margin-left:0}.rapor{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:23px}.ew{grid-template-columns:1fr auto}.ew .dl{display:none}.ew .sev{justify-self:start}.two{grid-template-columns:1fr}.kv{grid-template-columns:1fr 1fr}.hb{grid-template-columns:96px 1fr 56px}}
@media print{body{background:#fff}.bar{position:static;-webkit-print-color-adjust:exact;print-color-adjust:exact}.ctl,.pbtn,.seg{display:none}main{padding:0}.card,.hero{break-inside:avoid}.hero,.hm td,.stack i,.hb i,.sev,.flag{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<header class="bar">
  <div class="logo">PJ</div>
  <div class="t"><b>PENA JFKN</b><span>Dasbor eksekutif pemantauan JF tiap UE I</span></div>
  <div class="ctl">
    <div><label for="u">Unit eselon I (UPK)</label><select id="u"></select></div>
    <div><label for="p">Periode</label><select id="p"></select></div>
    <button class="pbtn" onclick="window.print()">Cetak</button>
  </div>
</header>
<main id="app"></main>
<script>
(function(){
'use strict';
const UE={
 DJPb:['Ditjen Perbendaharaan',1.7,['Kanwil DJPb Jawa Barat','Kanwil DJPb Jawa Timur','Kanwil DJPb Sumatera Utara','KPPN Jakarta II','KPPN Bandung I','KPPN Makassar','Kanwil DJPb Papua','KPPN Medan I','Dit. Pelaksanaan Anggaran','Dit. Akuntansi dan Pelaporan Keuangan']],
 DJKN:['Ditjen Kekayaan Negara',1.0,['Kanwil DJKN DKI Jakarta','KPKNL Jakarta I','KPKNL Surabaya','KPKNL Medan','Kanwil DJKN Sulawesi Selatan','KPKNL Sorong','Dit. Penilaian','Dit. Lelang']],
 DJA:['Ditjen Anggaran',.6,['Dit. Penyusunan APBN','Dit. Anggaran Bidang Perekonomian','Dit. Anggaran Bidang PMK','Dit. Anggaran Bidang Polhuk','Dit. Sistem Penganggaran','Dit. PNBP SDA']],
 DJPPR:['Ditjen Pengelolaan Pembiayaan dan Risiko',.45,['Dit. Surat Utang Negara','Dit. Pembiayaan Syariah','Dit. Pinjaman dan Hibah','Dit. Pengelolaan Risiko','Dit. Strategi dan Portofolio']],
 DJPK:['Ditjen Perimbangan Keuangan',.45,['Dit. Dana Transfer Umum','Dit. Dana Transfer Khusus','Dit. Pembiayaan dan Kapasitas Daerah','Dit. Evaluasi Pengelolaan dan Informasi Keuangan Daerah','Dit. Pajak Daerah dan Retribusi Daerah']],
 BKF:['Badan Kebijakan Fiskal',.5,['Pusat Kebijakan APBN','Pusat Kebijakan Pendapatan Negara','Pusat Kebijakan Sektor Keuangan','Pusat Kebijakan Ekonomi Makro','Pusat Kebijakan Pembiayaan Iklim']],
 ITJEN:['Inspektorat Jenderal',.55,['Inspektorat I','Inspektorat II','Inspektorat III','Inspektorat IV','Inspektorat V','Inspektorat VI','Inspektorat VII']]
};
const PER=['Triwulan III 2026','Triwulan II 2026','Triwulan I 2026'];
const DIM=[
 ['A','Profil dan sebaran JF','Jenis, jenjang, unit, wilayah'],
 ['B','Formasi dan bezetting','Kebutuhan, kekosongan, gap'],
 ['C','Uji kompetensi','Peserta, kelulusan, sertifikat'],
 ['D','Kinerja dan angka kredit','SKP, capaian AK, kenaikan jenjang'],
 ['E','Pengembangan kompetensi','AKP, pelatihan, learning path'],
 ['F','Mutasi dan pensiun','Keluar, masuk, pengangkatan'],
 ['G','Penghargaan JF','Riwayat penghargaan pegawai']
];
const JEN=['Ahli Utama','Ahli Madya','Ahli Muda','Ahli Pertama','Penyelia','Mahir','Terampil'];
const JW=[.006,.11,.37,.36,.04,.06,.054];
const JENIS=[['Analis Keuangan Negara','#0F2A4A'],['Pengawas Keuangan Negara','#5C86B5'],['Penilai Pemerintah','#A9C0DA'],['Pelelang','#E3A91B']];
const JMIX={DJPb:[.82,.18,0,0],DJKN:[.35,.12,.33,.2],DJA:[.94,.06,0,0],DJPPR:[.95,.05,0,0],DJPK:[.93,.07,0,0],BKF:[.97,.03,0,0],ITJEN:[.06,.94,0,0]};

function rng(seed){let a=0;for(const c of seed)a=(a*31+c.charCodeAt(0))|0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const fmt=n=>Math.round(n).toLocaleString('id-ID');
const pc=(a,b,d)=>b?(a/b*100).toLocaleString('id-ID',{maximumFractionDigits:d==null?0:d}):'0';
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function gen(uk,pi){
  const [nama,s,sat]=UE[uk];const r=rng(uk+'|'+pi);const R=(a,b)=>a+r()*(b-a);
  const total=Math.round(2600*s*R(.94,1.06));
  const jen=JW.map(w=>Math.round(total*w*R(.85,1.15)));
  const jenis=JMIX[uk].map(w=>Math.round(total*w));
  // satker-level
  const st=sat.map((n,i)=>{const sh=(i<3?1.6:1)*R(.6,1.4);return {n,w:sh}});
  const sw=st.reduce((a,x)=>a+x.w,0);
  st.forEach(x=>{x.jf=Math.round(total*x.w/sw);x.keb=Math.round(x.jf*R(1.02,1.45));x.data=R(.82,1);x.lulus=R(.55,.92);x.ak=R(.55,.95);x.jp=R(.45,.95);x.net=R(-.06,.03);x.pg=R(.04,.3);
    x.sc={A:x.data<.88?'crit':x.data<.94?'warn':'ok',B:x.jf/x.keb<.75?'crit':x.jf/x.keb<.85?'warn':'ok',C:x.lulus<.65?'crit':x.lulus<.75?'warn':'ok',D:x.ak<.65?'crit':x.ak<.8?'warn':'ok',E:x.jp<.6?'crit':x.jp<.75?'warn':'ok',F:x.net<-.035?'crit':x.net<0?'warn':'ok',G:x.pg<.08?'warn':'ok'}});
  // B
  const keb=jen.map((v,i)=>Math.round(v*(i===1||i===0?R(1.25,1.6):R(.95,1.25))));
  // C
  const pes=Math.round(total*R(.05,.08)),lul=Math.round(pes*R(.62,.86)),sert=Math.round(lul*R(.7,.98));
  const akBlmUkom=Math.round(total*R(.02,.045)),lama6=Math.round(akBlmUkom*R(.25,.6));
  const tw=[0,1,2,3].map(i=>{const p=Math.round(pes*R(.7,1.3));return [p,Math.round(p*R(.6,.88))]});
  // D
  const pred=[R(.14,.22),R(.6,.7),R(.06,.12),R(.01,.03),R(.002,.01)];const ps=pred.reduce((a,b)=>a+b,0);
  const predN=pred.map(x=>Math.round(total*x/ps));
  const akCap=R(.68,.93);const eligible=Math.round(total*R(.035,.06)),naik=Math.round(eligible*R(.45,.8));
  const stag=Math.round(total*R(.02,.05)),lama=Math.round(total*R(.04,.09));const ikiOk=R(.62,.9);
  // E
  const jpB=[R(.12,.32),R(.38,.5)];jpB.push(1-jpB[0]-jpB[1]);
  const lp=R(.48,.8),akpU=Math.round(total*R(.18,.3)),akpP=Math.round(akpU*R(.5,.82)),gapNo=Math.round(R(3,12));
  // F
  const flow=[0,1,2,3].map(()=>[Math.round(total*R(.008,.022)),Math.round(total*R(.008,.025)),Math.round(total*R(.003,.009))]);// masuk,keluar,pensiun
  const bup=[Math.round(total*R(.012,.025)),Math.round(total*R(.015,.03)),Math.round(total*R(.018,.034))];
  const kosongBup=Math.round(bup[0]*R(.35,.75));
  const keNonJf=Math.round(total*R(.003,.012));
  // G
  const award=[['Satyalancana Karya Satya',Math.round(total*R(.04,.07))],['Penghargaan Menteri Keuangan',Math.round(total*R(.004,.012))],['Pegawai/JF teladan unit',Math.round(total*R(.01,.025))],['Inovasi dan karya tulis',Math.round(total*R(.003,.01))]];
  const sbTanpa=Math.round(predN[0]*R(.4,.75));
  return {nama,total,jen,jenis,st,keb,pes,lul,sert,akBlmUkom,lama6,tw,predN,akCap,eligible,naik,stag,lama,ikiOk,jpB,lp,akpU,akpP,gapNo,flow,bup,kosongBup,keNonJf,award,sbTanpa,dataLengkap:st.reduce((a,x)=>a+x.data*x.jf,0)/total};
}

// ===== early warning rules =====
function warnings(d){
  const W=[];const add=(dim,sev,txt,rule,n,pic)=>W.push({dim,sev,txt,rule,n,pic});
  const kebT=d.keb.reduce((a,b)=>a+b,0),bezT=d.jen.reduce((a,b)=>a+b,0);
  const lowSat=d.st.filter(x=>x.jf/x.keb<.75);
  // A
  const dl=d.dataLengkap;add('A',dl<.86?'crit':dl<.95?'warn':'ok',`Kelengkapan data profil JF ${pc(dl,1)}%, ${fmt(d.total*(1-dl))} JF belum sinkron dengan data kepegawaian.`,'Ambang: data lengkap minimal 95%',fmt(d.total*(1-dl)),'UPK Satker');
  // B
  add('B',lowSat.length>=2?'crit':lowSat.length?'warn':'ok',lowSat.length?`${lowSat.length} satker dengan bezetting di bawah 75% kebutuhan: ${lowSat.slice(0,3).map(x=>x.n).join(', ')}${lowSat.length>3?', dan lainnya':''}.`:'Seluruh satker memiliki bezetting minimal 75% dari kebutuhan.','Ambang: bezetting di bawah 75% kebutuhan',lowSat.length,'UPK Pusat, UKP JF');
  const over=d.jen.map((v,i)=>v-d.keb[i]).map((g,i)=>[JEN[i],g]).filter(x=>x[1]>0);
  if(over.length)add('B','warn',`Jenjang ${over.map(x=>x[0]).join(', ')} melebihi kebutuhan (${fmt(over.reduce((a,x)=>a+x[1],0))} orang); kenaikan ke jenjang ini akan tertahan.`,'Ambang: bezetting melebihi formasi jenjang',fmt(over.reduce((a,x)=>a+x[1],0)),'UPK Pusat');
  // C
  const lr=d.lul/d.pes;add('C',lr<.65?'crit':lr<.8?'warn':'ok',`Kelulusan ukom ${pc(d.lul,d.pes)}% (${fmt(d.lul)} dari ${fmt(d.pes)} peserta).`,'Ambang: kelulusan minimal 80%',pc(d.lul,d.pes)+'%','UPT JF');
  add('C',d.lama6>80?'crit':d.lama6>20?'warn':'ok',`${fmt(d.lama6)} JF sudah memenuhi angka kredit lebih dari 6 bulan tetapi belum mengikuti ukom.`,'Ambang: lebih dari 6 bulan menunggu ukom',fmt(d.lama6),'UPK Satker, UPT JF');
  // D
  const kurang=d.predN[2]+d.predN[3]+d.predN[4];
  add('D',d.stag/d.total>.045?'crit':'warn',`${fmt(d.stag)} JF tidak menambah angka kredit selama 2 tahun berturut-turut (predikat di bawah Baik).`,'Ambang: AK tidak bertambah 2 tahun',fmt(d.stag),'Atasan langsung, UPK Satker');
  add('D',d.lama/d.total>.07?'warn':'ok',`${fmt(d.lama)} JF berada di jenjang yang sama lebih dari 4 tahun.`,'Ambang: lebih dari 4 tahun di satu jenjang',fmt(d.lama),'UPK Pusat');
  if(d.ikiOk<.75)add('D','warn',`Hanya ${pc(d.ikiOk,1)}% IKI JF sesuai dengan hasil kerja jenjang dan bidang tugasnya.`,'Ambang: kesesuaian IKI minimal 75%',pc(d.ikiOk,1)+'%','UPS JF');
  // E
  add('E',d.jpB[0]>.25?'crit':d.jpB[0]>.15?'warn':'ok',`${fmt(d.total*d.jpB[0])} JF (${pc(d.jpB[0],1)}%) belum memenuhi 20 JP pengembangan kompetensi tahun ini.`,'Ambang: di bawah 20 JP per tahun, lebih dari 15% JF',fmt(d.total*d.jpB[0]),'UPK Satker, UPT JF');
  if(d.gapNo>=6)add('E','warn',`${d.gapNo} kebutuhan kompetensi prioritas belum memiliki program pelatihan.`,'Ambang: kebutuhan AKP tanpa program',d.gapNo,'UPT JF, Pusdiklat');
  // F
  const net=d.flow.reduce((a,f)=>a+f[0]-f[1]-f[2],0);
  add('F',net<-d.total*.03?'crit':net<0?'warn':'ok',net<0?`Arus bersih negatif ${fmt(-net)} JF dalam 4 triwulan: lebih banyak yang keluar dan pensiun daripada yang masuk.`:`Arus bersih positif ${fmt(net)} JF dalam 4 triwulan.`,'Ambang: masuk lebih kecil dari keluar dan pensiun',fmt(Math.abs(net)),'UPK Pusat');
  add('F',d.kosongBup>d.total*.015?'crit':'warn',`${fmt(d.bup[0])} JF mencapai batas usia pensiun dalam 12 bulan; ${fmt(d.kosongBup)} posisi belum memiliki rencana pengganti.`,'Ambang: pensiun 12 bulan tanpa kader pengganti',fmt(d.kosongBup),'UPK Pusat, UPK Satker');
  // G
  add('G',d.sbTanpa/d.predN[0]>.5?'warn':'ok',`${fmt(d.sbTanpa)} JF berpredikat Sangat Baik 2 tahun berturut-turut belum pernah diusulkan untuk penghargaan.`,'Ambang: kinerja Sangat Baik tanpa penghargaan',fmt(d.sbTanpa),'UPK Pusat');
  const o={crit:0,warn:1,ok:2};W.sort((a,b)=>o[a.sev]-o[b.sev]);return W;
}
function dimSev(W,L){const s=W.filter(w=>w.dim===L).map(w=>w.sev);return s.includes('crit')?'crit':s.includes('warn')?'warn':'ok'}
const SEVL={crit:'Kritis',warn:'Waspada',ok:'Aman'};

const st={u:'DJPb',p:0,ewf:'all'};
const $=s=>document.querySelector(s);
function init(){
  $('#u').innerHTML=Object.entries(UE).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('');
  $('#p').innerHTML=PER.map((p,i)=>`<option value="${i}">${p}</option>`).join('');
  $('#u').onchange=e=>{st.u=e.target.value;render()};
  $('#p').onchange=e=>{st.p=+e.target.value;render()};
  render();
}

function hbar(label,v,max,col,tip,mark){return `<div class="hb" ${tip?`data-tip="${tip}"`:''}><span>${label}</span><span class="tr"><i style="width:${v/max*100}%;background:${col||'var(--navy)'}"></i>${mark!=null?`<em style="left:${mark/max*100}%"></em>`:''}</span><span class="v">${fmt(v)}</span></div>`}
function flag(W,L){const w=W.filter(x=>x.dim===L);if(!w.length)return'';const t=w.find(x=>x.sev!=='ok')||w[0];return `<div class="flag ${t.sev}"><i>${t.sev==='ok'?'✓':'!'}</i><span>${t.txt}</span></div>`}
function dimHead(L,W){const d=DIM.find(x=>x[0]===L);const s=dimSev(W,L);return `<div class="dimh"><div class="L">${L}</div><div><h3>${d[1]}</h3><p>${d[2]}</p></div><span class="sev ${s}">${SEVL[s]}</span></div>`}
function kv(items){return `<div class="kv">${items.map(i=>`<div class="${i[2]||''}"><span>${i[0]}</span><b>${i[1]}</b></div>`).join('')}</div>`}

function lineSvg(series,labels,cols,names){
  const W=520,H=160,p=28,max=Math.max(1,...series.flat());
  const x=i=>p+i*(W-2*p)/(labels.length-1),y=v=>H-24-(v/max)*(H-44);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Tren triwulanan">`;
  [0,.5,1].forEach(f=>{const yy=y(max*f);s+=`<line x1="${p}" x2="${W-p}" y1="${yy}" y2="${yy}" stroke="#EBEFF4"/>`});
  series.forEach((ser,k)=>{s+=`<polyline fill="none" stroke="${cols[k]}" stroke-width="2.5" points="${ser.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`;ser.forEach((v,i)=>{s+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="#fff" stroke="${cols[k]}" stroke-width="2.5"/><text x="${x(i)}" y="${k?y(v)+18:y(v)-9}" text-anchor="middle" font-size="11.5" font-weight="700" fill="${cols[k]}">${fmt(v)}</text>`})});
  labels.forEach((l,i)=>{s+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="11.5" fill="#5E6B7C">${l}</text>`});
  return s+`</svg><div class="leg">${names.map((n,k)=>`<span><i style="background:${cols[k]}"></i>${n}</span>`).join('')}</div>`;
}
function flowSvg(flow){
  const W=520,H=210,mid=86,max=Math.max(1,...flow.map(f=>Math.max(f[0],f[1]+f[2]))),bw=48,lab=['Tw IV 25','Tw I 26','Tw II 26','Tw III 26'];
  const sc=v=>v/max*58;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Arus masuk dan keluar">`;
  s+=`<line x1="20" x2="${W-20}" y1="${mid}" y2="${mid}" stroke="#8A96A6"/>`;
  flow.forEach((f,i)=>{const cx=70+i*120;const net=f[0]-f[1]-f[2];
    s+=`<rect x="${cx-bw/2}" y="${mid-sc(f[0])}" width="${bw}" height="${sc(f[0])}" rx="3" fill="#1E8A63"><title>Masuk ${f[0]}</title></rect>`;
    s+=`<rect x="${cx-bw/2}" y="${mid}" width="${bw}" height="${sc(f[1])}" fill="#5C86B5"><title>Keluar/mutasi ${f[1]}</title></rect>`;
    s+=`<rect x="${cx-bw/2}" y="${mid+sc(f[1])}" width="${bw}" height="${sc(f[2])}" rx="3" fill="#C0423A"><title>Pensiun ${f[2]}</title></rect>`;
    s+=`<text x="${cx}" y="${mid-sc(f[0])-6}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E8A63">+${f[0]}</text>`;
    s+=`<text x="${cx}" y="${mid+sc(f[1]+f[2])+14}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#C0423A">−${f[1]+f[2]}</text>`;
    s+=`<text x="${cx+bw/2+8}" y="${mid+4}" font-size="11" font-weight="700" fill="${net<0?'#C0423A':'#1E8A63'}">${net>0?'+':''}${net}</text>`;
    s+=`<text x="${cx}" y="${H-2}" text-anchor="middle" font-size="11.5" fill="#5E6B7C">${lab[i]}</text>`});
  return s+`</svg><div class="leg"><span><i style="background:#1E8A63"></i>Masuk (pengangkatan, mutasi masuk)</span><span><i style="background:#5C86B5"></i>Keluar (mutasi, pindah jabatan)</span><span><i style="background:#C0423A"></i>Pensiun</span></div>`;
}

function render(){
  const d=gen(st.u,st.p),W=warnings(d);
  const nC=W.filter(w=>w.sev==='crit').length,nW=W.filter(w=>w.sev==='warn').length;
  const kebT=d.keb.reduce((a,b)=>a+b,0),bez=d.jen.reduce((a,b)=>a+b,0);
  const rapVal={A:[fmt(d.total),'pejabat fungsional'],B:[pc(bez,kebT)+'%','bezetting terhadap kebutuhan'],C:[pc(d.lul,d.pes)+'%','kelulusan ukom'],D:[pc(d.akCap,1)+'%','capaian angka kredit'],E:[pc(1-d.jpB[0],1)+'%','memenuhi 20 JP'],F:[(()=>{const n=d.flow.reduce((a,f)=>a+f[0]-f[1]-f[2],0);return (n>0?'+':'')+fmt(n)})(),'arus bersih 4 triwulan'],G:[fmt(d.award.reduce((a,x)=>a+x[1],0)),'penghargaan diterima']};
  let h=`<section class="hero"><div class="who">${esc(d.nama)}, posisi ${PER[st.p]}</div>
   <h1>${fmt(d.total)} pejabat fungsional, <em>${nC} peringatan kritis</em> dan ${nW} waspada.</h1>
   <p>Rapor tujuh dimensi pembinaan JF. Klik dimensi untuk melihat rinciannya; titik warna menunjukkan status peringatan dini.</p>
   <div class="rapor">${DIM.map(([L,n])=>{const s=dimSev(W,L);return `<button class="rp" data-go="${L}"><span class="st ${s}" title="${SEVL[s]}"></span><span class="lt"><i>${L}</i>${n}</span><b>${rapVal[L][0]}</b><small>${rapVal[L][1]}</small></button>`}).join('')}</div></section>`;

  // early warning + heatmap
  const fl=W.filter(w=>st.ewf==='all'?w.sev!=='ok':w.sev===st.ewf);
  h+=`<div class="sect"><h2>Peringatan dini</h2><p>Dibaca otomatis dari data PENA JFKN dengan ambang yang dapat diatur.</p></div>
  <div class="ewgrid"><section class="card"><div class="ewh"><h3>${fl.length} hal perlu perhatian</h3><div class="seg">${[['all','Semua'],['crit','Kritis'],['warn','Waspada'],['ok','Aman']].map(x=>`<button class="${st.ewf===x[0]?'on':''}" data-ewf="${x[0]}">${x[1]}</button>`).join('')}</div></div>
   ${fl.map(w=>`<div class="ew"><span class="sev ${w.sev}">${SEVL[w.sev]}</span><button class="dl" data-go="${w.dim}" title="Ke dimensi ${w.dim}">${w.dim}</button><div><b>${w.txt}</b><div class="rule">${w.rule}</div></div><div class="pic"><strong>${w.n}</strong>${w.pic}</div></div>`).join('')||'<div class="ew"><div style="grid-column:1/-1;color:var(--muted)">Tidak ada peringatan pada kategori ini.</div></div>'}
  </section>
  <section class="card"><div class="ewh"><h3>Peta risiko per satker</h3></div><div class="hmwrap"><p style="font-size:12.5px;color:var(--muted);margin-bottom:8px">Satker diurutkan dari yang paling banyak sel merah.</p>
   <table class="hm"><thead><tr><th class="rh">Satker</th>${DIM.map(x=>`<th title="${x[1]}">${x[0]}</th>`).join('')}</tr></thead><tbody>
   ${d.st.slice().sort((a,b)=>score(b)-score(a)).map(x=>`<tr><th class="rh" title="${esc(x.n)}">${esc(x.n)}</th>${DIM.map(([L,n])=>`<td class="${x.sc[L]}" data-tip="<b>${esc(x.n)}</b>${n}: ${SEVL[x.sc[L]]}<br>${hmTip(x,L)}">${x.sc[L]==='crit'?'!':''}</td>`).join('')}</tr>`).join('')}
   </tbody></table><div class="leg"><span><i style="background:#D6EEE3"></i>Aman</span><span><i style="background:#F7DFA9"></i>Waspada</span><span><i style="background:#E8786D"></i>Kritis</span></div></div></section></div>`;

  // dimensions
  h+=`<div class="sect"><h2>Rincian tujuh dimensi</h2><p>Setiap kartu memuat angka utama, grafik, dan peringatan dini dimensinya.</p></div><div class="dims">`;
  // A
  const jmax=Math.max(...d.jen);
  h+=`<section class="card dim" id="dim-A">${dimHead('A',W)}${kv([['Total JF',fmt(d.total)],['Keahlian : keterampilan',fmt(d.jen.slice(0,4).reduce((a,b)=>a+b,0))+'<small> : '+fmt(d.jen.slice(4).reduce((a,b)=>a+b,0))+'</small>'],['Satker',d.st.length]])}
   <div class="lbl">Komposisi jenis JF</div><div class="stack">${d.jenis.map((v,i)=>v?`<i style="width:${v/d.total*100}%;background:${JENIS[i][1]};color:${i>=2?'#0F2A4A':'#fff'}" data-tip="${JENIS[i][0]}: ${fmt(v)}">${v/d.total>.1?pc(v,d.total)+'%':''}</i>`:'').join('')}</div>
   <div class="leg">${JENIS.map((j,i)=>d.jenis[i]?`<span><i style="background:${j[1]}"></i>${j[0]}</span>`:'').join('')}</div>
   <div class="two" style="margin-top:14px"><div><div class="lbl">Jenjang</div>${d.jen.map((v,i)=>v?hbar(JEN[i],v,jmax,i>=4?'var(--mid)':'var(--navy)'):'').join('')}</div>
   <div><div class="lbl">Satker terbesar</div>${d.st.slice().sort((a,b)=>b.jf-a.jf).slice(0,6).map(x=>hbar(x.n.replace(/^(Kanwil |Dit\. )/,''),x.jf,d.st.reduce((m,y)=>Math.max(m,y.jf),0),'var(--lt)')).join('')}</div></div>${flag(W,'A')}</section>`;
  // B
  const bmax=Math.max(...d.keb,...d.jen);
  h+=`<section class="card dim" id="dim-B">${dimHead('B',W)}${kv([['Kebutuhan (formasi)',fmt(kebT)],['Bezetting',fmt(bez)],['Kekosongan',fmt(kebT-bez),kebT-bez>kebT*.15?'bad':'']])}
   <div class="lbl">Bezetting dibanding kebutuhan per jenjang</div>${d.jen.map((v,i)=>d.keb[i]?`<div class="hb" data-tip="<b>${JEN[i]}</b>Kebutuhan ${fmt(d.keb[i])}, bezetting ${fmt(v)}<br>${v>d.keb[i]?'Kelebihan '+fmt(v-d.keb[i]):'Kosong '+fmt(d.keb[i]-v)}"><span>${JEN[i]}</span><span class="tr"><i style="width:${Math.min(v,d.keb[i])/bmax*100}%;background:var(--navy)"></i>${v>d.keb[i]?`<i style="width:${(v-d.keb[i])/bmax*100}%;background:var(--crit)"></i>`:''}<em style="left:${d.keb[i]/bmax*100}%"></em></span><span class="v" style="color:${v>d.keb[i]?'var(--crit)':v/d.keb[i]<.75?'var(--warn)':'inherit'}">${pc(v,d.keb[i])}%</span></div>`:'').join('')}
   <div class="leg"><span><i style="background:var(--navy)"></i>Bezetting</span><span><i style="background:var(--gold)"></i>Garis kebutuhan</span><span><i style="background:var(--crit)"></i>Melebihi kebutuhan</span></div>
   <div class="lbl" style="margin-top:14px">Satker dengan gap terbesar</div>${d.st.slice().sort((a,b)=>(b.keb-b.jf)-(a.keb-a.jf)).slice(0,4).map(x=>hbar(x.n.replace(/^(Kanwil |Dit\. )/,''),x.keb-x.jf,d.st.reduce((m,y)=>Math.max(m,y.keb-y.jf),1),x.jf/x.keb<.75?'var(--crit)':'var(--warn)',`${esc(x.n)}: bezetting ${pc(x.jf,x.keb)}%`)).join('')}${flag(W,'B')}</section>`;
  // C
  h+=`<section class="card dim" id="dim-C">${dimHead('C',W)}${kv([['Peserta',fmt(d.pes)],['Lulus',fmt(d.lul)+'<small> ('+pc(d.lul,d.pes)+'%)</small>',d.lul/d.pes<.7?'bad':'good'],['Sertifikat terbit',fmt(d.sert)]])}
   <div class="lbl">Tren peserta dan kelulusan per triwulan</div>${lineSvg([d.tw.map(t=>t[0]),d.tw.map(t=>t[1])],['Tw IV 25','Tw I 26','Tw II 26','Tw III 26'],['#5C86B5','#1E8A63'],['Peserta','Lulus'])}
   <div class="lbl" style="margin-top:12px">Antrean menuju ukom</div>${hbar('AK terpenuhi',d.akBlmUkom,d.akBlmUkom,'var(--lt)')}${hbar('Lebih dari 6 bulan',d.lama6,d.akBlmUkom,'var(--crit)')}${flag(W,'C')}</section>`;
  // D
  const PRED=[['Sangat Baik','#1E8A63'],['Baik','#5C86B5'],['Butuh Perbaikan','#E3A91B'],['Kurang','#E57D73'],['Sangat Kurang','#C0423A']];
  h+=`<section class="card dim" id="dim-D">${dimHead('D',W)}${kv([['Capaian AK terhadap target',pc(d.akCap,1)+'%',d.akCap<.75?'bad':''],['Naik jenjang / memenuhi syarat',fmt(d.naik)+'<small> / '+fmt(d.eligible)+'</small>'],['IKI sesuai',pc(d.ikiOk,1)+'%',d.ikiOk<.75?'bad':'good']])}
   <div class="lbl">Sebaran predikat kinerja (SKP) tahun berjalan</div><div class="stack">${d.predN.map((v,i)=>`<i style="width:${v/d.total*100}%;background:${PRED[i][1]}" data-tip="${PRED[i][0]}: ${fmt(v)} JF (${pc(v,d.total,1)}%)">${v/d.total>.07?pc(v,d.total)+'%':''}</i>`).join('')}</div>
   <div class="leg">${PRED.map(p=>`<span><i style="background:${p[1]}"></i>${p[0]}</span>`).join('')}</div>
   <div class="lbl" style="margin-top:14px">Risiko karier</div>${hbar('AK stagnan 2 tahun',d.stag,Math.max(d.stag,d.lama),'var(--crit)')}${hbar('Lebih dari 4 tahun di jenjang',d.lama,Math.max(d.stag,d.lama),'var(--warn)')}${hbar('Memenuhi syarat, belum naik',d.eligible-d.naik,Math.max(d.stag,d.lama),'var(--mid)')}${flag(W,'D')}</section>`;
  // E
  h+=`<section class="card dim" id="dim-E">${dimHead('E',W)}${kv([['Memenuhi 20 JP',pc(1-d.jpB[0],1)+'%',d.jpB[0]>.25?'bad':''],['Learning path selesai',pc(d.lp,1)+'%'],['Usulan AKP terpenuhi',fmt(d.akpP)+'<small> / '+fmt(d.akpU)+'</small>']])}
   <div class="lbl">Jam pelajaran pengembangan kompetensi tahun ini</div><div class="stack">${[['Di bawah 20 JP','#C0423A'],['20 sampai 39 JP','#5C86B5'],['40 JP atau lebih','#1E8A63']].map((x,i)=>`<i style="width:${d.jpB[i]*100}%;background:${x[1]}" data-tip="${x[0]}: ${fmt(d.total*d.jpB[i])} JF">${pc(d.jpB[i],1)}%</i>`).join('')}</div>
   <div class="leg"><span><i style="background:#C0423A"></i>Di bawah 20 JP</span><span><i style="background:#5C86B5"></i>20 sampai 39 JP</span><span><i style="background:#1E8A63"></i>40 JP atau lebih</span></div>
   <div class="lbl" style="margin-top:14px">Analisis kebutuhan pembelajaran (AKP)</div>${hbar('Usulan AKP',d.akpU,d.akpU,'var(--lt)')}${hbar('Terpenuhi program',d.akpP,d.akpU,'var(--ok)')}${hbar('Kompetensi tanpa program',d.gapNo,d.gapNo<20?20:d.gapNo,'var(--crit)')}${flag(W,'E')}</section>`;
  // F
  h+=`<section class="card dim" id="dim-F">${dimHead('F',W)}${kv([['Pensiun 12 bulan',fmt(d.bup[0]),d.kosongBup>d.total*.015?'bad':''],['Pensiun 24 bulan',fmt(d.bup[0]+d.bup[1])],['Keluar ke jabatan non-JF',fmt(d.keNonJf)]])}
   <div class="lbl">Arus masuk, keluar, dan pensiun per triwulan</div>${flowSvg(d.flow)}${flag(W,'F')}</section>`;
  // G
  const amax=Math.max(...d.award.map(a=>a[1]));
  h+=`<section class="card dim wide" id="dim-G">${dimHead('G',W)}<div class="two"><div>${kv([['Penghargaan diterima',fmt(d.award.reduce((a,x)=>a+x[1],0))],['JF Sangat Baik 2 tahun',fmt(d.predN[0])],['Belum pernah diusulkan',fmt(d.sbTanpa),'bad']])}</div>
   <div><div class="lbl">Jenis penghargaan (riwayat 3 tahun)</div>${d.award.map(a=>hbar(a[0].replace('Penghargaan ',''),a[1],amax,'var(--gold)')).join('')}</div></div>${flag(W,'G')}</section></div>`;

  h+=`<div class="foot"><div><b>Cara membaca peringatan dini.</b> Kritis: melewati ambang dan berdampak langsung pada karier JF atau kinerja organisasi. Waspada: mendekati ambang atau perlu dipantau. Ambang dalam contoh ini adalah usulan dan dapat ditetapkan bersama UPT JF.</div><div><b>Sumber data.</b> PENA JFKN, data simulasi untuk contoh tampilan.</div></div>`;
  $('#app').innerHTML=h;
}
function score(x){return Object.values(x.sc).reduce((a,s)=>a+(s==='crit'?3:s==='warn'?1:0),0)}
function hmTip(x,L){return {A:`Data lengkap ${pc(x.data,1)}%`,B:`Bezetting ${pc(x.jf,x.keb)}% (${x.jf}/${x.keb})`,C:`Kelulusan ukom ${pc(x.lulus,1)}%`,D:`Capaian AK ${pc(x.ak,1)}%`,E:`Memenuhi 20 JP ${pc(x.jp,1)}%`,F:`Arus bersih ${(x.net*100).toLocaleString('id-ID',{maximumFractionDigits:1})}%`,G:`Penerima penghargaan ${pc(x.pg,1)}%`}[L]}

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){const el=document.getElementById('dim-'+g.dataset.go);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});el.animate([{boxShadow:'0 0 0 3px #E3A91B'},{boxShadow:'0 0 0 0 transparent'}],{duration:1400})}return}
  const f=e.target.closest('[data-ewf]');if(f){st.ewf=f.dataset.ewf;render()}
});
let tip=null;
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(!t){if(tip){tip.remove();tip=null}return}if(!tip){tip=document.createElement('div');tip.className='tip';document.body.appendChild(tip)}tip.innerHTML=t.dataset.tip});
document.addEventListener('mousemove',e=>{if(tip){tip.style.left=Math.min(innerWidth-270,e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px'}});
init();
})();
</script>
</body>
</html>
